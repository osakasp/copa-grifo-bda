<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100c">
  <title>Arena BDA | Campeonatos do Clã</title>
  <meta name="description" content="Plataforma oficial para criação e acompanhamento dos campeonatos do Clã BDA.">
  <style>
    html,body{height:100%;margin:0;background:#07100c;color:#f4f7f2;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    .loader{width:min(320px,90vw)}
    .griffin{font-size:54px;filter:drop-shadow(0 8px 24px rgba(216,178,72,.3))}
    h1{margin:12px 0 8px;font-size:22px}p{margin:0;color:#9fb0a5;font-size:13px}
  </style>
</head>
<body>
  <main class="loader"><div class="griffin">🦅</div><h1>Carregando a Arena BDA</h1><p>Conectando os campeonatos à nuvem...</p></main>
  <script>
    (async () => {
      try {
        const response = await fetch('./preview-v2.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();
        html = html.replace('</head>', `
          <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"><\/script>
          <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"><\/script>
          <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"><\/script>
        </head>`);
        html = html.replace('</body>', '<script src="./firebase-auth.js"><\/script><script src="./team-badges.js"><\/script><script src="./champion-banners.js"><\/script><script src="./bda-logo.js"><\/script><script src="./arena-bda.js"><\/script><script src="./firestore-sync.js"><\/script><script src="./admin-panel.js"><\/script><script src="./confrontos-copa-grifo.js"><\/script><script src="./confrontos.js"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main><h1>Não foi possível abrir a Arena</h1><p>Atualize a página e tente novamente.</p></main>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
