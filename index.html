<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100c">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Arena BDA">
  <meta name="apple-mobile-web-app-title" content="Arena BDA">
  <meta name="description" content="Plataforma oficial para criação e acompanhamento dos campeonatos do Clã BDA.">
  <meta property="og:title" content="Arena BDA | Campeonatos do Clã">
  <meta property="og:description" content="Campeonatos, clubes, resultados e notícias do Clã BDA.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//www.gstatic.com">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="shortcut icon" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="preload" href="./arena-runtime.bundle.js?v=20260814-4" as="script">
  <link rel="preload" href="./arena-bda.js?v=20260825-2" as="script">
  <link rel="preload" href="./arena-interface.bundle.js?v=20260825-2" as="script">
  <title>Arena BDA | Campeonatos do Clã</title>
  <style id="arenaBootStyles">
    :root{--boot-bg:#07100c;--boot-surface:#0d1812;--boot-text:#f2f6f3;--boot-muted:#9eafa3;--boot-green:#35c979;color-scheme:dark}
    *{box-sizing:border-box}
    #arenaBoot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;text-align:center;background:var(--boot-bg);color:var(--boot-text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .16s ease,visibility .16s ease}
    #arenaBoot.hidden{opacity:0;visibility:hidden;pointer-events:none}
    #arenaBoot .loader-card{width:min(340px,92vw);padding:26px 22px;border:1px solid #26392d;border-radius:12px;background:var(--boot-surface);box-shadow:0 14px 42px rgba(0,0,0,.34)}
    #arenaBoot .griffin{width:68px;height:68px;margin:0 auto 15px;overflow:hidden;border:1px solid #b7cebe;border-radius:10px;background:#176b3d}
    #arenaBoot .griffin img{display:block;width:100%;height:100%;object-fit:cover}
    #arenaBoot h1{margin:0 0 8px;font-size:20px;line-height:1.15}
    #arenaBoot p{margin:0;color:var(--boot-muted);font-size:13px;line-height:1.5}
    #arenaBoot .spinner{width:30px;height:30px;margin:18px auto 0;border:2px solid #26392d;border-top-color:var(--boot-green);border-radius:50%;animation:arenaBootSpin .9s linear infinite}
    #arenaBoot .retry{display:none;width:100%;min-height:46px;margin-top:18px;border:0;border-radius:8px;color:#fff;background:#197847;font-weight:800;cursor:pointer}
    #arenaBoot .retry.show{display:block}
    @keyframes arenaBootSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#arenaBoot{transition:none}#arenaBoot .spinner{animation-duration:1.6s}}
  </style>
</head>
<body>
  <section id="arenaBoot" aria-live="polite" aria-busy="true">
    <div class="loader-card">
      <div class="griffin"><img src="./favicon.svg" alt="Escudo oficial Arena BDA" width="68" height="68" decoding="async" fetchpriority="high"></div>
      <h1 id="loadingTitle">Carregando a Arena BDA</h1>
      <p id="loadingMessage">Preparando campeonatos, clubes e resultados...</p>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <button class="retry" id="retryButton" type="button">Tentar novamente</button>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const REV = '20260825-2';
      const previewSource = `./preview-v2.html?v=${REV}`;
      const boot = document.getElementById('arenaBoot');
      const title = document.getElementById('loadingTitle');
      const message = document.getElementById('loadingMessage');
      const spinner = document.getElementById('spinner');
      const retryButton = document.getElementById('retryButton');

      const firebaseScripts = [
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js'
      ];
      const coreScripts = [
        './arena-runtime.bundle.js?v=20260814-4',
        './bda-logo.js?v=20260819-1',
        `./confrontos-validos.js?v=${REV}`,
        `./super-league-guard.js?v=${REV}`,
        `./arena-bda.js?v=${REV}`,
        `./arena-home-active.js?v=${REV}`,
        `./arena-lazy-features.js?v=${REV}`,
        `./arena-interface.bundle.js?v=${REV}`,
        `./arena-v3-cleanup.js?v=${REV}`
      ];
      const cloudScripts = [
        './firebase-auth.js?v=20260825-5',
        './notificacoes-bda.js?v=20260816-3',
        `./firestore-sync.js?v=${REV}`,
        './cloud-recovery.js?v=20260801-4',
        './admin-panel.js?v=20260814-1',
        './arena-auth-consumers.js?v=20260825-4',
        './site-health.js?v=20260814-2'
      ];

      let bootTimeoutId = 0;
      let transitionTimer = 0;
      let loadGeneration = 0;
      let cloudPromise = null;
      let cloudReady = false;
      let lastInteractionAt = performance.now();
      let cloudIdleTimer = 0;

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope:'./', updateViaCache:'none' }).catch(() => {});
        }, { once:true });
      }

      function setLoadingState() {
        boot.classList.remove('hidden');
        boot.setAttribute('aria-busy', 'true');
        retryButton.classList.remove('show');
        spinner.hidden = false;
        title.textContent = 'Carregando a Arena BDA';
        message.textContent = 'Preparando campeonatos, clubes e resultados...';
        clearTimeout(bootTimeoutId);
        bootTimeoutId = window.setTimeout(() => {
          title.textContent = 'A Arena está demorando para abrir';
          message.textContent = 'A conexão pode estar instável. Você pode tentar novamente.';
          spinner.hidden = true;
          retryButton.classList.add('show');
        }, 12000);
      }

      function showTransition(nextTitle, nextMessage) {
        clearTimeout(transitionTimer);
        boot.classList.remove('hidden');
        boot.setAttribute('aria-busy', 'true');
        retryButton.classList.remove('show');
        spinner.hidden = false;
        title.textContent = nextTitle || 'Atualizando a Arena BDA';
        message.textContent = nextMessage || 'Aplicando a interface e sincronizando os dados...';
      }

      function showLoadError(detail = 'Verifique sua conexão e tente novamente.') {
        clearTimeout(bootTimeoutId);
        clearTimeout(transitionTimer);
        boot.classList.remove('hidden');
        boot.setAttribute('aria-busy', 'false');
        title.textContent = 'Não foi possível abrir a Arena';
        message.textContent = detail;
        spinner.hidden = true;
        retryButton.classList.add('show');
      }

      function yieldFrame() {
        return new Promise(resolve => {
          let resolved = false;
          const finish = () => {
            if (resolved) return;
            resolved = true;
            resolve();
          };
          requestAnimationFrame(() => requestAnimationFrame(finish));
          window.setTimeout(finish, 120);
        });
      }

      async function settleAndReveal(generation, minimumDelay = 0) {
        if (generation !== loadGeneration) return;
        if (minimumDelay > 0) await new Promise(resolve => window.setTimeout(resolve, minimumDelay));
        await yieldFrame();
        await yieldFrame();
        if (generation !== loadGeneration) return;
        clearTimeout(bootTimeoutId);
        clearTimeout(transitionTimer);
        boot.setAttribute('aria-busy', 'false');
        boot.classList.add('hidden');
      }

      function queueScript(src, timeoutMs = 15000, priority = 'auto') {
        return new Promise((resolve, reject) => {
          const absoluteSrc = new URL(src, document.baseURI).href;
          const existing = Array.from(document.scripts).find(script => script.dataset.arenaSrc === absoluteSrc || script.src === absoluteSrc);
          if (existing) {
            if (existing.dataset.arenaLoaded === 'true') return resolve({ src, reused:true });
            const timeoutId = window.setTimeout(() => reject(new Error(`Tempo esgotado ao aguardar ${src}`)), timeoutMs);
            existing.addEventListener('load', () => {
              clearTimeout(timeoutId);
              existing.dataset.arenaLoaded = 'true';
              existing.dataset.arenaSrc = absoluteSrc;
              resolve({ src, reused:true });
            }, { once:true });
            existing.addEventListener('error', () => {
              clearTimeout(timeoutId);
              reject(new Error(`Falha ao carregar ${src}`));
            }, { once:true });
            return;
          }

          const script = document.createElement('script');
          let settled = false;
          const timeoutId = window.setTimeout(() => finish(new Error(`Tempo esgotado ao carregar ${src}`)), timeoutMs);
          const finish = error => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            if (error) {
              script.remove();
              reject(error);
              return;
            }
            script.dataset.arenaLoaded = 'true';
            resolve({ src, reused:false });
          };
          script.src = absoluteSrc;
          script.async = false;
          script.fetchPriority = priority;
          script.dataset.arenaSrc = absoluteSrc;
          script.addEventListener('load', () => finish(), { once:true });
          script.addEventListener('error', () => finish(new Error(`Falha ao carregar ${src}`)), { once:true });
          (document.body || document.head || document.documentElement).appendChild(script);
        });
      }

      async function loadOrderedBatch(scripts, failures, timeoutMs) {
        for (let index = 0; index < scripts.length; index += 1) {
          const src = scripts[index];
          await queueScript(src, timeoutMs + (index * 250), index < 6 ? 'high' : 'auto').catch(error => {
            failures.push({ src, error });
            console.error(`[Arena BDA] Falha no módulo ${src}`, error);
          });
          if (index < scripts.length - 1) await yieldFrame();
        }
      }

      function clearPreviewHead() {
        document.head.querySelectorAll('[data-arena-preview-head="true"]').forEach(node => node.remove());
      }

      function copyPreviewHead(sourceDoc) {
        clearPreviewHead();
        const previewBase = new URL(previewSource, location.href);
        sourceDoc.head.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"],style').forEach(node => {
          const clone = node.cloneNode(true);
          clone.dataset.arenaPreviewHead = 'true';
          if (clone.tagName === 'LINK' && clone.hasAttribute('href')) {
            clone.setAttribute('href', new URL(clone.getAttribute('href'), previewBase).href);
          }
          document.head.appendChild(clone);
        });
      }

      function copyBodyAttributes(sourceBody) {
        for (const name of document.body.getAttributeNames()) document.body.removeAttribute(name);
        for (const name of sourceBody.getAttributeNames()) document.body.setAttribute(name, sourceBody.getAttribute(name));
      }

      async function executePreviewScripts(sourceScripts) {
        const previewBase = new URL(previewSource, location.href);
        for (const sourceScript of sourceScripts) {
          const rawSrc = sourceScript.getAttribute('src') || '';
          if (/arena-v3-cleanup\.js/i.test(rawSrc)) continue;
          const script = document.createElement('script');
          for (const attr of sourceScript.attributes) script.setAttribute(attr.name, attr.value);
          if (rawSrc) {
            const absoluteSrc = new URL(rawSrc, previewBase).href;
            script.src = absoluteSrc;
            script.async = false;
            script.dataset.arenaSrc = absoluteSrc;
            await new Promise((resolve, reject) => {
              script.addEventListener('load', () => {
                script.dataset.arenaLoaded = 'true';
                resolve();
              }, { once:true });
              script.addEventListener('error', reject, { once:true });
              document.body.appendChild(script);
            });
          } else {
            script.textContent = sourceScript.textContent;
            document.body.appendChild(script);
          }
        }
      }

      async function ensureCloud(reason = 'feature') {
        if (cloudPromise) return cloudPromise;
        const generation = loadGeneration;
        const cloudFailures = [];
        cloudPromise = (async () => {
          document.documentElement.dataset.arenaCloud = 'loading';
          await loadOrderedBatch(firebaseScripts, cloudFailures, 12000);
          if (generation !== loadGeneration) return;
          await loadOrderedBatch(cloudScripts, cloudFailures, 15000);
          if (generation !== loadGeneration) return;
          cloudReady = true;
          document.documentElement.dataset.arenaCloud = cloudFailures.length ? 'partial' : 'ready';
          window.dispatchEvent(new CustomEvent('arena:cloud-ready', {
            detail:{ reason, failures:cloudFailures.map(item => item.src) }
          }));
        })();
        return cloudPromise;
      }

      function installCloudTriggers() {
        window.ArenaBDAEnsureCloud = reason => ensureCloud(reason || 'feature');
        const noteInteraction = () => { lastInteractionAt = performance.now(); };
        ['pointerdown','touchstart','keydown','scroll'].forEach(type => {
          document.addEventListener(type, noteInteraction, { passive:true, capture:true });
        });

        document.addEventListener('click', event => {
          const element = event.target instanceof Element ? event.target : null;
          const cloudFeature = element?.closest('[data-go="feedback"],[data-mobile-go="feedback"],[data-sheet-go="feedback"]');
          if (cloudFeature && !cloudReady) {
            ensureCloud(cloudFeature.dataset.go || cloudFeature.dataset.mobileGo || cloudFeature.dataset.sheetGo || 'feature').catch(error => {
              console.error('[Arena BDA] Falha ao preparar recurso online', error);
            });
          }

          const adminButton = element?.closest('#adminBtn');
          if (!adminButton) return;
          const authReady = Boolean(window.ArenaBDAAuth?.auth);
          if (cloudReady && authReady) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          adminButton.setAttribute('aria-busy', 'true');
          adminButton.textContent = 'CARREGANDO...';
          showTransition('Preparando acesso administrativo', 'Carregando login e sincronização sem trocar a interface...');
          ensureCloud('admin').then(async () => {
            if (loadGeneration <= 0 || !window.ArenaBDAAuth?.auth) throw new Error('Autenticação não ficou disponível');
            await settleAndReveal(loadGeneration, 140);
            document.getElementById('adminBtn')?.click();
          }).catch(error => {
            console.error('[Arena BDA] Falha ao preparar login', error);
            showLoadError('O acesso administrativo não terminou de carregar. Tente novamente.');
          });
        }, true);
      }

      function scheduleCloudWhenQuiet(delay = 8000) {
        clearTimeout(cloudIdleTimer);
        cloudIdleTimer = window.setTimeout(() => {
          if (cloudPromise) return;
          const quietFor = performance.now() - lastInteractionAt;
          if (document.hidden || quietFor < 4000) {
            scheduleCloudWhenQuiet(Math.max(1200, 4000 - quietFor));
            return;
          }
          const startCloudWhenIdle = () => {
            if (performance.now() - lastInteractionAt < 3000) {
              scheduleCloudWhenQuiet(1800);
              return;
            }
            ensureCloud('idle').catch(error => console.error('[Arena BDA] Recursos online não carregaram', error));
          };
          if ('requestIdleCallback' in window) window.requestIdleCallback(startCloudWhenIdle, { timeout:8000 });
          else startCloudWhenIdle();
        }, delay);
      }

      async function mountArena(generation) {
        setLoadingState();
        const response = await fetch(previewSource, { cache:'no-cache' });
        if (!response.ok) throw new Error(`Falha HTTP ${response.status} ao carregar a Arena`);
        const previewHtml = await response.text();
        if (generation !== loadGeneration) return;

        const sourceDoc = new DOMParser().parseFromString(previewHtml, 'text/html');
        if (!sourceDoc.querySelector('.app-shell')) throw new Error('A página principal não respondeu corretamente.');
        const sourceScripts = Array.from(sourceDoc.querySelectorAll('script'));
        sourceScripts.forEach(script => script.remove());

        copyPreviewHead(sourceDoc);
        copyBodyAttributes(sourceDoc.body);
        document.body.replaceChildren(
          ...Array.from(sourceDoc.body.childNodes).map(node => node.cloneNode(true)),
          boot
        );

        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
        document.documentElement.dataset.arenaDocumentMode = 'single';
        try { localStorage.removeItem('arena-bda-theme'); } catch {}

        await executePreviewScripts(sourceScripts);
        if (generation !== loadGeneration) return;
        installCloudTriggers();

        const coreFailures = [];
        const startedAt = performance.now();
        await loadOrderedBatch(coreScripts, coreFailures, 15000);
        if (generation !== loadGeneration) return;

        document.documentElement.dataset.arenaEnhanced = coreFailures.length ? 'partial' : 'true';
        document.documentElement.dataset.arenaLoadMs = String(Math.round(performance.now() - startedAt));
        window.dispatchEvent(new CustomEvent('arena:enhanced', {
          detail:{ failures:coreFailures.map(item => item.src), loadMs:Number(document.documentElement.dataset.arenaLoadMs) }
        }));
        document.documentElement.dataset.arenaEnhancements = 'ready';
        window.dispatchEvent(new CustomEvent('arena:enhancements-ready', { detail:{ failures:[] } }));
        if (coreFailures.length && typeof window.toast === 'function') window.toast('A Arena abriu, mas alguns recursos não carregaram');

        scheduleCloudWhenQuiet();
        await settleAndReveal(generation, 40);
      }

      async function startLoad() {
        loadGeneration += 1;
        const generation = loadGeneration;
        try {
          await mountArena(generation);
        } catch (error) {
          console.error('[Arena BDA] A interface não terminou de carregar', error);
          showLoadError('A interface não terminou de carregar. Tente novamente.');
        }
      }

      retryButton.addEventListener('click', () => window.location.reload());
      startLoad();
    })();
  </script>
</body>
</html>
