    ];const ligaBByes=['Cruzeiro FC BDA','Gomes BDA','Lobo BDA','Los Kansas BDA','Sport Recife BDA','BDA Golden FC','Chapecoense BDA','Praia BDA','Boleiros FC BDA','Nacional FC BDA','Real City BDA','Liga BDA','Vera Cruz BDA','Atlético Goianiense BDA','BDA URDLS','Esperança BDA','Florence Real FC BDA'];const seeds=[
      {id:'copa-grifo',name:'Copa Grifo BDA',edition:'8ª edição',format:'Mata-mata',status:'Finalizado',phase:'Campeão definido',maxTeams:19,badge:'🦅',participants:['Zombie FC BDA','JOGOBUGADO BDA','Inter Brasil BDA','Vasco da Gama BDA'],description:'Competição tradicional do Clã BDA.'},
      {id:'copa-francos',name:'Copa Francos',edition:'Próxima edição',format:'Mata-mata',status:'Planejado',phase:'Preparação',maxTeams:16,badge:'🕊️',participants:[],description:'Competição especial do Clã BDA.'},
      {id:'liga-a',name:'Liga A BDA',edition:'1º turno',format:'Pontos corridos',status:'Em andamento',phase:'Fase de classificação',maxTeams:12,badge:'🥇',participants:['Inter FC BDA','CV Cruz BDA','CR Flamengo BDA','Cajueiro FC BDA','São Paulo FC BDA','HellYeah BDA','Vasco BDA','Flamestre FC BDA','Imortais FC BDA','Jester Warriors FC BDA','Independente FC BDA','Santos FC BDA'],matches:ligaAMatches,description:'Primeira divisão do Clã BDA.'},
      {id:'liga-b',name:'Liga B BDA',edition:'1º turno',format:'Pontos corridos',status:'Em andamento',phase:'Fase de classificação',maxTeams:17,badge:'🛡️',participants:['Boleiros FC BDA','Sport Recife BDA','Vera Cruz BDA','Atlético Goianiense BDA','Los Kansas BDA','BDA Golden FC','Liga BDA','BDA URDLS','Lobo BDA','Chapecoense BDA','Real City BDA','Esperança BDA','Gomes BDA','Praia BDA','Nacional FC BDA','Florence Real FC BDA','Cruzeiro FC BDA'],matches:ligaBMatches,byes:ligaBByes,description:'Divisão de acesso do Clã BDA.'}
    ];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const PORTAL_KEY='bda-portal-state-v2',oldKey='bda-v3-tournaments';
    const readJson=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:null}catch{return null}};
    const saved=readJson(PORTAL_KEY)||readJson(oldKey)||[];
    const tournaments=seeds.map(seed=>{const old=saved.find(t=>t.id===seed.id)||{};return {...seed,participants:Array.from(new Set([...(seed.participants||[]),...(old.participants||[])])),pendingTeams:Array.isArray(old.pendingTeams)?old.pendingTeams:[],results:old.results&&typeof old.results==='object'?old.results:{}}});
    const persist=()=>{try{localStorage.setItem(PORTAL_KEY,JSON.stringify(tournaments))}catch{}};persist();
    let filter='Todos',currentId=null,currentView='matches',roundChoice='all',draftResults={};
    const grid=document.getElementById('grid'),detail=document.getElementById('detail'),count=document.getElementById('count'),activeCount=document.getElementById('activeCount'),openCount=document.getElementById('openCount'),clubCount=document.getElementById('clubCount');
    const visible=()=>filter==='Todos'?tournaments:filter==='Abertos'?tournaments.filter(t=>['Em andamento','Inscrições abertas','Planejado'].includes(t.status)):tournaments.filter(t=>t.status==='Finalizado');
    const current=()=>tournaments.find(t=>t.id===currentId);
    const resultKey=(r,m)=>r+':'+m;
    const scoreValue=v=>Number.isInteger(Number(v))&&Number(v)>=0?Number(v):null;
    function render(){const list=visible();count.textContent=tournaments.length;activeCount.textContent=tournaments.filter(t=>t.status==='Em andamento').length;openCount.textContent=tournaments.filter(t=>t.status==='Inscrições abertas').length;clubCount.textContent=tournaments.reduce((total,t)=>total+(Array.isArray(t.participants)?t.participants.length:0),0);grid.innerHTML=list.map(t=>{const n=Array.isArray(t.participants)?t.participants.length:0;return '<article class="card championship league-'+esc(t.id)+'"><div><span class="eyebrow" style="color:#197847">'+esc(t.status)+'</span><h3>'+esc(t.badge||'🏆')+' '+esc(t.name)+'</h3><small style="color:#9eafa3">'+esc(t.edition||'Temporada atual')+'</small></div><button class="open" data-open="'+esc(t.id)+'">Abrir</button><p>'+esc(t.description||'Competição do Clã BDA.')+'</p><div class="meta"><span><b>'+esc(t.format||'A definir')+'</b> formato</span><span><b>'+n+'/'+(Number(t.maxTeams)||'∞')+'</b> clubes</span></div></article>'}).join('')||'<div class="card empty">Nenhuma competição nesta categoria.</div>'}
    function standings(t){const rows={};(t.participants||[]).forEach(name=>rows[name]={name,played:0,won:0,draw:0,lost:0,goalsFor:0,goalsAgainst:0,points:0});(t.matches||[]).forEach((round,r)=>round.forEach((pair,m)=>{const res=t.results?.[resultKey(r,m)];if(!res||scoreValue(res.home)===null||scoreValue(res.away)===null)return;const h=rows[pair[0]]||(rows[pair[0]]={name:pair[0],played:0,won:0,draw:0,lost:0,goalsFor:0,goalsAgainst:0,points:0}),a=rows[pair[1]]||(rows[pair[1]]={name:pair[1],played:0,won:0,draw:0,lost:0,goalsFor:0,goalsAgainst:0,points:0}),hs=Number(res.home),as=Number(res.away);h.played++;a.played++;h.goalsFor+=hs;h.goalsAgainst+=as;a.goalsFor+=as;a.goalsAgainst+=hs;if(hs>as){h.won++;a.lost++;h.points+=3}else if(hs<as){a.won++;h.lost++;a.points+=3}else{h.draw++;a.draw++;h.points++;a.points++}}));return Object.values(rows).sort((a,b)=>b.points-a.points||((b.goalsFor-b.goalsAgainst)-(a.goalsFor-a.goalsAgainst))||b.goalsFor-a.goalsFor||a.name.localeCompare(b.name,'pt-BR'))}
    function matchesPanel(t){const rounds=t.matches||[];if(!rounds.length)return '<div class="empty">Os confrontos desta competição ainda não foram cadastrados.</div>';const selected=roundChoice==='all'?rounds.map((round,i)=>[round,i]):[[rounds[Number(roundChoice)]||[],Number(roundChoice)]];const games=selected.map(([round,i])=>'<div class="round"><h4>Rodada '+(i+1)+(t.byes?.[i]?' · Folga: '+esc(t.byes[i]):'')+'</h4>'+round.map((pair,m)=>{const res=t.results?.[resultKey(i,m)],score=res&&scoreValue(res.home)!==null?'<span class="result-chip">'+res.home+' × '+res.away+'</span>':'<span class="result-empty">Aguardando resultado</span>';return '<div class="match"><span>'+esc(pair[0])+'</span>'+score+'<span>'+esc(pair[1])+'</span></div>'}).join('')+'</div>').join('');return '<div class="round-bar"><label class="round-summary" for="roundChoice">'+(roundChoice==='all'?'Todas as rodadas':'Rodada '+(Number(roundChoice)+1))+' · '+rounds.reduce((n,r)=>n+r.length,0)+' jogos</label><select id="roundChoice" class="round-select"><option value="all"'+(roundChoice==='all'?' selected':'')+'>Todas as rodadas</option>'+rounds.map((_,i)=>'<option value="'+i+'"'+(String(roundChoice)===String(i)?' selected':'')+'>Rodada '+(i+1)+(t.byes?.[i]?' · folga '+esc(t.byes[i]):'')+'</option>').join('')+'</select></div><div class="fixtures">'+games+'</div>'}
    function tablePanel(t){const rows=standings(t);return '<p class="admin-note">A classificação é calculada automaticamente a partir dos resultados publicados. Jogos sem placar ainda não somam pontos.</p><div class="standing-wrap"><table class="standing"><thead><tr><th># Clube</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead><tbody>'+rows.map((row,i)=>'<tr class="'+(i<4?'top ':'')+(i>=Math.max(0,rows.length-4)?'danger':'')+'"><td>'+(i+1)+'. '+esc(row.name)+'</td><td>'+row.played+'</td><td>'+row.won+'</td><td>'+row.draw+'</td><td>'+row.lost+'</td><td>'+(row.goalsFor-row.goalsAgainst)+'</td><td><b>'+row.points+'</b></td></tr>').join('')+'</tbody></table></div>'}
    function clubsPanel(t){const pending=t.pendingTeams||[];return '<div class="clubs">'+((t.participants||[]).length?(t.participants||[]).map((c,i)=>'<span class="club">'+(i+1)+'. '+esc(c)+'</span>').join(''):'<span class="empty">Nenhum clube confirmado nesta edição.</span>')+'</div>'+(pending.length?'<h4 style="margin:18px 0 8px;color:#f3ce68">Solicitações locais</h4><div class="pending-list">'+pending.map(c=>'<div class="pending-item"><span>'+esc(c)+'</span><span class="status-pill">Aguardando aprovação</span></div>').join('')+'</div>':'')}
    function adminPanel(t){const rounds=t.matches||[],r=roundChoice==='all'?0:Number(roundChoice)||0,round=rounds[r]||[],pending=t.pendingTeams||[],last=t.lastResultUpdate?new Date(t.lastResultUpdate).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'nenhuma publicação';return '<div class="admin-section"><h4>Adicionar clube</h4><p class="admin-note">O clube entra como solicitação pendente e não altera a tabela automaticamente.</p><form data-team-form class="form-grid"><input class="text-input" name="team" maxlength="42" placeholder="Nome do clube" required><button class="admin-btn" type="submit">Solicitar</button></form>'+(pending.length?'<div class="pending-list">'+pending.map(c=>'<div class="pending-item"><span>'+esc(c)+'</span><span class="status-pill">Pendente</span></div>').join('')+'</div>':'')+'</div><div class="admin-section"><h4>Editar resultados · Rodada '+(r+1)+'</h4><p class="admin-note">Altere somente os gols. Para retirar um placar, apague os dois campos. A classificação será recalculada automaticamente.</p><p class="history-note">Última publicação: '+esc(last)+'</p><div class="round-bar"><select id="roundChoice" class="round-select">'+rounds.map((_,i)=>'<option value="'+i+'"'+(i===r?' selected':'')+'>Rodada '+(i+1)+'</option>').join('')+'</select></div><form data-results-form>'+round.map((pair,m)=>{const res=draftResults[resultKey(r,m)]||t.results?.[resultKey(r,m)]||{};return '<div class="admin-match"><span>'+esc(pair[0])+'</span><span><input class="score-input" inputmode="numeric" min="0" max="99" type="number" name="home-'+m+'" value="'+(res.clear?'':(res.home??''))+'" aria-label="Gols de '+esc(pair[0])+'"> × <input class="score-input" inputmode="numeric" min="0" max="99" type="number" name="away-'+m+'" value="'+(res.clear?'':(res.away??''))+'" aria-label="Gols de '+esc(pair[1])+'"></span><span>'+esc(pair[1])+'</span></div>'}).join('')+'<div class="admin-actions"><button class="save-btn" type="submit">Confirmar e publicar</button><button class="danger-btn" type="button" data-clear-round>Limpar rodada</button></div></form></div>'+(t.resultHistory?.length?'<div class="admin-section"><button class="admin-btn" type="button" data-undo-results>Desfazer última publicação</button></div>':'')}
    function open(id){const t=tournaments.find(x=>x.id===id);if(!t)return;currentId=id;currentView='matches';roundChoice='all';draftResults={};renderDetail();detail.classList.add('show');grid.style.display='none';document.querySelector('.toolbar').style.display='none';detail.scrollIntoView({block:'start',behavior:'auto'})}
    function renderDetail(){const t=current();if(!t)return;const clubs=Array.isArray(t.participants)?t.participants:[];const panel=currentView==='table'?tablePanel(t):currentView==='clubs'?clubsPanel(t):currentView==='admin'?adminPanel(t):matchesPanel(t);detail.innerHTML='<div class="detail-head"><div><span class="eyebrow">'+esc(t.status)+'</span><h2>'+esc(t.badge||'🏆')+' '+esc(t.name)+'</h2><p>'+esc(t.description||'Competição do Clã BDA.')+'</p></div><button class="close" data-close>Voltar</button></div><div class="stats"><div class="stat"><span>Formato</span><b>'+esc(t.format||'A definir')+'</b></div><div class="stat"><span>Fase</span><b>'+esc(t.phase||'Preparação')+'</b></div><div class="stat"><span>Clubes</span><b>'+clubs.length+'/'+(Number(t.maxTeams)||'∞')+'</b></div></div><div class="detail-tools"><button class="detail-tab '+(currentView==='matches'?'active':'')+'" data-view="matches">Jogos</button><button class="detail-tab '+(currentView==='table'?'active':'')+'" data-view="table">Classificação</button><button class="detail-tab '+(currentView==='clubs'?'active':'')+'" data-view="clubs">Clubes</button><button class="admin-btn" data-view="admin">Gerenciar</button></div><div class="card panel"><h3>'+({matches:'Confrontos do 1º turno',table:'Tabela de classificação',clubs:'Clubes participantes',admin:'Administração rápida'}[currentView])+'</h3>'+panel+'</div>'}
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===f));render()}const o=e.target.closest('[data-open]');if(o)open(o.dataset.open);const v=e.target.closest('[data-view]');if(v){currentView=v.dataset.view;renderDetail()}if(e.target.closest('[data-close]')){detail.classList.remove('show');grid.style.display='grid';document.querySelector('.toolbar').style.display='flex';currentId=null;window.scrollTo({top:0,behavior:'auto'})}});
    document.addEventListener('change',e=>{if(e.target.id==='roundChoice'){roundChoice=e.target.value;renderDetail()}});
    document.addEventListener('input',e=>{if(e.target.closest('[data-results-form]')){const form=e.target.form,r=roundChoice==='all'?0:Number(roundChoice)||0;form.querySelectorAll('.admin-match').forEach((row,m)=>{const homeRaw=row.querySelector('[name="home-'+m+'"]')?.value.trim()||'',awayRaw=row.querySelector('[name="away-'+m+'"]')?.value.trim()||'',key=resultKey(r,m);if(!homeRaw&&!awayRaw)draftResults[key]={clear:true};else draftResults[key]={home:scoreValue(homeRaw),away:scoreValue(awayRaw)}})}});
    document.addEventListener('click',e=>{if(e.target.closest('[data-clear-round]')){const t=current(),r=roundChoice==='all'?0:Number(roundChoice)||0;if(!confirm('Limpar os placares desta rodada? Essa ação só será aplicada após confirmar a publicação.'))return;(t.matches?.[r]||[]).forEach((_,m)=>{draftResults[resultKey(r,m)]={clear:true}});renderDetail()}if(e.target.closest('[data-undo-results]')){const t=current(),last=(t.resultHistory||[]).at(-1);if(!last||!confirm('Desfazer a última publicação desta liga?'))return;t.results=last.results||{};t.resultHistory=(t.resultHistory||[]).slice(0,-1);t.lastResultUpdate=Date.now();persist();renderDetail();alert('Última publicação desfeita.')}});
    document.addEventListener('submit',e=>{if(e.target.matches('[data-team-form]')){e.preventDefault();const t=current(),name=e.target.team.value.trim();if(!name)return;if((t.participants||[]).some(c=>c.toLocaleLowerCase()===name.toLocaleLowerCase())||(t.pendingTeams||[]).some(c=>c.toLocaleLowerCase()===name.toLocaleLowerCase())){alert('Esse clube já está cadastrado ou aguardando aprovação.');return}t.pendingTeams=[...(t.pendingTeams||[]),name];persist();e.target.reset();renderDetail();return}if(e.target.matches('[data-results-form]')){e.preventDefault();const t=current(),keys=Object.keys(draftResults);if(!keys.length){alert('Nenhuma alteração detectada.');return}const invalid=Object.values(draftResults).some(res=>!res.clear&&(res.home===null||res.away===null));if(invalid){alert('Informe os dois gols do jogo ou apague os dois campos para retirar o placar.');return}if(!confirm('Publicar os resultados preenchidos e atualizar a classificação?'))return;const before={...(t.results||{})},next={...before};keys.forEach(key=>{const res=draftResults[key];if(res.clear)delete next[key];else next[key]={home:res.home,away:res.away}});t.resultHistory=[...(t.resultHistory||[]),{at:Date.now(),results:before}].slice(-10);t.results=next;t.lastResultUpdate=Date.now();persist();draftResults={};renderDetail();alert('Resultados publicados. A tabela foi recalculada.')}});
    render();
  })();
  </script>
