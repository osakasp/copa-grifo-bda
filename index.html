    #arenaBoot p{margin:0;color:var(--boot-muted);font-size:13px;line-height:1.5}

      function preloadScripts(scripts) {

          if (document.head.querySelector('link[data-arena-preload="true"][href="' + src + '"]')) return;

      function yieldFrame() {
        return new Promise(resolve => {
          let resolved = false;
          const finish = () => {
            if (resolved) return;
            resolved = true;
            resolve();
          };
          requestAnimationFrame(() => requestAnimationFrame(finish));
          window.setTimeout(finish, 120);
        });
      }

      async function settleAndReveal(generation, minimumDelay = 0) {
        if (generation !== loadGeneration) return;
        if (minimumDelay > 0) await new Promise(resolve => window.setTimeout(resolve, minimumDelay));
        await new Promise(resolve => requestAnimationFrame(resolve));
        if (generation !== loadGeneration) return;
        clearTimeout(bootTimeoutId);
        clearTimeout(transitionTimer);
        boot.setAttribute('aria-busy', 'false');
        boot.classList.add('hidden');

      function queueScript(src, timeoutMs = 15000, priority = 'auto') {
        return new Promise((resolve, reject) => {
          const absoluteSrc = new URL(src, document.baseURI).href;
          const existing = Array.from(document.scripts).find(script => script.dataset.arenaSrc === absoluteSrc || script.src === absoluteSrc);
          if (existing) {
            if (existing.dataset.arenaLoaded === 'true') return resolve({ src, reused:true });
            const timeoutId = window.setTimeout(() => reject(new Error(`Tempo esgotado ao aguardar ${src}`)), timeoutMs);
            existing.addEventListener('load', () => {
              clearTimeout(timeoutId);
              existing.dataset.arenaLoaded = 'true';
              existing.dataset.arenaSrc = absoluteSrc;
              resolve({ src, reused:true });
            }, { once:true });
            existing.addEventListener('error', () => {
              clearTimeout(timeoutId);
              reject(new Error(`Falha ao carregar ${src}`));
            }, { once:true });
            return;
          }

          const script = document.createElement('script');
          let settled = false;
          const timeoutId = window.setTimeout(() => finish(new Error(`Tempo esgotado ao carregar ${src}`)), timeoutMs);
          const finish = error => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            if (error) {
              script.remove();
              reject(error);
              return;
            }
            script.dataset.arenaLoaded = 'true';
            resolve({ src, reused:false });
          };
          script.src = absoluteSrc;
          script.async = false;
          script.fetchPriority = priority;
          script.dataset.arenaSrc = absoluteSrc;
          script.addEventListener('load', () => finish(), { once:true });
          script.addEventListener('error', () => finish(new Error(`Falha ao carregar ${src}`)), { once:true });
          (document.body || document.head || document.documentElement).appendChild(script);
        });
      }

      async function loadOrderedBatch(scripts, failures, timeoutMs) {
        for (let index = 0; index < scripts.length; index += 1) {
          const src = scripts[index];
          await queueScript(src, timeoutMs + (index * 250), index < 6 ? 'high' : 'auto').catch(error => {
            failures.push({ src, error });
            console.error(`[Arena BDA] Falha no módulo ${src}`, error);
          });
          // A ordem dos módulos garante as dependências. Não inserimos pausas artificiais entre scripts.
        }
      }

        for (const sourceScript of sourceScripts) {
          const rawSrc = sourceScript.getAttribute('src') || '';
          if (/arena-v3-cleanup\.js/i.test(rawSrc)) continue;
          const script = document.createElement('script');
          for (const attr of sourceScript.attributes) script.setAttribute(attr.name, attr.value);
          if (rawSrc) {
            const absoluteSrc = new URL(rawSrc, previewBase).href;
            script.src = absoluteSrc;
            script.async = false;
            script.dataset.arenaSrc = absoluteSrc;
            await new Promise((resolve, reject) => {
              script.addEventListener('load', () => {
                script.dataset.arenaLoaded = 'true';
                resolve();
              }, { once:true });
              script.addEventListener('error', reject, { once:true });
              document.body.appendChild(script);
            });
          } else {
            script.textContent = sourceScript.textContent;
            document.body.appendChild(script);
          }
        }
      }

      async function ensureCloud(reason = 'feature') {
        if (cloudPromise) return cloudPromise;
        const generation = loadGeneration;
        const cloudFailures = [];
        cloudPromise = (async () => {
          document.documentElement.dataset.arenaCloud = 'loading';
          await loadOrderedBatch(firebaseScripts, cloudFailures, 12000);
          if (generation !== loadGeneration) return;
          await loadOrderedBatch(cloudScripts, cloudFailures, 15000);
          if (generation !== loadGeneration) return;
          cloudReady = true;
          document.documentElement.dataset.arenaCloud = cloudFailures.length ? 'partial' : 'ready';
          window.dispatchEvent(new CustomEvent('arena:cloud-ready', {
            detail:{ reason, failures:cloudFailures.map(item => item.src) }
          }));
        })();
        return cloudPromise;
      }

      function installCloudTriggers() {
        window.ArenaBDAEnsureCloud = reason => ensureCloud(reason || 'feature');
        const noteInteraction = () => { lastInteractionAt = performance.now(); };
        ['pointerdown','touchstart','keydown','scroll'].forEach(type => {
          document.addEventListener(type, noteInteraction, { passive:true, capture:true });
        });

        document.addEventListener('click', event => {
          const element = event.target instanceof Element ? event.target : null;
          const cloudFeature = element?.closest('[data-go="feedback"],[data-mobile-go="feedback"],[data-sheet-go="feedback"]');
          if (cloudFeature && !cloudReady) {
            ensureCloud(cloudFeature.dataset.go || cloudFeature.dataset.mobileGo || cloudFeature.dataset.sheetGo || 'feature').catch(error => {
              console.error('[Arena BDA] Falha ao preparar recurso online', error);
            });
          }

          const adminButton = element?.closest('#adminBtn');
          if (!adminButton) return;

          // Começa o download do pacote administrativo no primeiro toque.
          // O download ocorre em paralelo; a execução continua respeitando dependências.
          preloadScripts([...firebaseScripts, ...cloudScripts]);

          const authReady = Boolean(window.ArenaBDAAuth?.auth);
          if (cloudReady && authReady) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          const previousLabel = adminButton.textContent;
          adminButton.setAttribute('aria-busy', 'true');
          adminButton.textContent = 'CARREGANDO...';
          ensureCloud('admin').then(async () => {
            if (loadGeneration <= 0 || !window.ArenaBDAAuth?.auth) throw new Error('Autenticação não ficou disponível');
            adminButton.removeAttribute('aria-busy');
            adminButton.textContent = previousLabel;
            document.getElementById('adminBtn')?.click();
          }).catch(error => {
            console.error('[Arena BDA] Falha ao preparar login', error);
            adminButton.removeAttribute('aria-busy');
            adminButton.textContent = previousLabel;
            window.showToast?.('O acesso administrativo demorou para carregar. Tente novamente.');
          });
        }, true);
      }

      function scheduleCloudWhenQuiet(delay = 12000) {
        clearTimeout(cloudIdleTimer);
        cloudIdleTimer = window.setTimeout(() => {
          if (cloudPromise) return;
          const quietFor = performance.now() - lastInteractionAt;
          if (document.hidden || quietFor < 5000) {
            scheduleCloudWhenQuiet(Math.max(1600, 5000 - quietFor));
            return;
          }
          const startCloudWhenIdle = () => {
            if (performance.now() - lastInteractionAt < 5000) {
              scheduleCloudWhenQuiet(2200);
              return;
            }
            ensureCloud('idle').catch(error => console.error('[Arena BDA] Recursos online não carregaram', error));
          };
          if ('requestIdleCallback' in window) window.requestIdleCallback(startCloudWhenIdle, { timeout:8000 });
          else startCloudWhenIdle();
        }, delay);
      }

      function decodeInlinePreview(value) {
        const bytes = Uint8Array.from(atob(value), char => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function mountArena(generation) {
        setLoadingState();
        let previewHtml = decodeInlinePreview(INLINE_PREVIEW_HTML);
        if (!previewHtml) {
          const response = await fetch(previewSource, { cache:'default' });
          if (!response.ok) throw new Error(`Falha HTTP ${response.status} ao carregar a Arena`);
          previewHtml = await response.text();
        } else {
          // Mantém a cópia publicada atualizada sem bloquear a primeira pintura.
          fetch(previewSource, { cache:'no-store' }).catch(() => {});
        }
        if (generation !== loadGeneration) return;

        const sourceDoc = new DOMParser().parseFromString(previewHtml, 'text/html');
        if (!sourceDoc.querySelector('.app-shell')) throw new Error('A página principal não respondeu corretamente.');
        const sourceScripts = Array.from(sourceDoc.querySelectorAll('script'));
        sourceScripts.forEach(script => script.remove());

        copyPreviewHead(sourceDoc);
        copyBodyAttributes(sourceDoc.body);
        document.body.replaceChildren(
          ...Array.from(sourceDoc.body.childNodes).map(node => node.cloneNode(true)),
          boot
        );

        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
        document.documentElement.dataset.arenaDocumentMode = 'single';
        try { localStorage.removeItem('arena-bda-theme'); } catch {}

        await executePreviewScripts(sourceScripts);
        if (generation !== loadGeneration) return;
        installCloudTriggers();

        // A página já está utilizável neste ponto. O núcleo complementar não deve
        // manter o visitante preso atrás de uma tela de carregamento.
        document.documentElement.dataset.arenaCriticalReady = 'shell';
        await settleAndReveal(generation, 0);

        const coreFailures = [];
        const startedAt = performance.now();

        // Apenas o núcleo de navegação é carregado antes da primeira interação.
        // Recursos de campeonatos/classificação ficam para depois, evitando picos de CPU.
        const firstScripts = coreScripts.slice(0, criticalScriptCount);
        const backgroundScripts = coreScripts.slice(criticalScriptCount);

        await loadOrderedBatch(firstScripts, coreFailures, 12000);
        if (generation !== loadGeneration) return;

        document.documentElement.dataset.arenaCriticalReady = coreFailures.length ? 'partial' : 'true';

        const backgroundFailures = [];
        const finishBackground = async () => {
          if (generation !== loadGeneration) return;
          for (let i = 0; i < backgroundScripts.length; i += 2) {
            if (generation !== loadGeneration) return;
            await loadOrderedBatch(backgroundScripts.slice(i, i + 2), backgroundFailures, 12000);
            await new Promise(resolve => setTimeout(resolve, 16));
          }

          if (generation !== loadGeneration) return;
          const allFailures = [...coreFailures, ...backgroundFailures];
          document.documentElement.dataset.arenaEnhanced = allFailures.length ? 'partial' : 'true';
          document.documentElement.dataset.arenaLoadMs = String(Math.round(performance.now() - startedAt));
          window.dispatchEvent(new CustomEvent('arena:enhanced', {
            detail:{ failures:allFailures.map(item => item.src), loadMs:Number(document.documentElement.dataset.arenaLoadMs) }
          }));
          document.documentElement.dataset.arenaEnhancements = 'ready';
          window.dispatchEvent(new CustomEvent('arena:enhancements-ready', {
            detail:{ failures:backgroundFailures.map(item => item.src) }
          }));
        };

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(() => finishBackground().catch(() => {}), { timeout: 1800 });
        } else {
          window.setTimeout(() => finishBackground().catch(() => {}), 900);
        }

        scheduleCloudWhenQuiet();
      }

      async function startLoad() {
        loadGeneration += 1;
        const generation = loadGeneration;
        try {
          await mountArena(generation);
        } catch (error) {
          console.error('[Arena BDA] A interface não terminou de carregar', error);
          showLoadError('A interface não terminou de carregar. Tente novamente.');
        }
      }

      retryButton.addEventListener('click', () => window.location.reload());
      startLoad();
    })();
  </script>
</body>
</html>
