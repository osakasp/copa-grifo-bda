<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#197847">
  <meta name="description" content="Portal de campeonatos do Clã BDA.">
  <link rel="icon" href="./favicon.svg">
  <link rel="manifest" href="./site.webmanifest">
  <title>Arena BDA | Campeonatos</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17231d;background:#f3f6f4;line-height:1.4}
    *{box-sizing:border-box}body{margin:0;background:#f3f6f4}button{font:inherit;cursor:pointer}
    .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,calc((100% - 1080px)/2));background:#197847;color:#fff;box-shadow:0 2px 8px #13492c30}
    .brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#fff;color:#197847;font-size:22px}.brand strong{display:block;font-size:16px}.brand span{display:block;color:#d9f0df;font-size:11px}
    .top-actions{display:flex;gap:8px}.top-actions a{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border:1px solid #ffffff50;border-radius:7px;color:#fff;text-decoration:none;font-size:12px;font-weight:700;background:#ffffff14}
    main{width:min(1080px,100%);margin:auto;padding:18px 16px 90px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px;padding:22px 20px;border-radius:12px;background:linear-gradient(135deg,#197847,#0f5f35 72%);color:#fff}.hero h1{margin:3px 0 5px;font-size:clamp(28px,6vw,44px);line-height:.95}.hero p{margin:0;color:#d8efdf;font-size:13px}.eyebrow{color:#f3d272;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero-count{text-align:right}.hero-count b{display:block;font-size:32px;line-height:1}.hero-count span{font-size:10px;color:#d8efdf}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 10px}.toolbar h2{margin:0;font-size:22px}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.filter{min-height:36px;padding:0 12px;border:1px solid #d5e0d8;border-radius:6px;color:#647269;background:#fff;font-size:11px;font-weight:700;white-space:nowrap}.filter.active{border-color:#197847;background:#197847;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid #d5e0d8;border-radius:8px;background:#fff;box-shadow:0 2px 8px #1e3d2910}.championship{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px}.championship h3{margin:0;color:#17231d;font-size:20px;line-height:1}.championship p{grid-column:1;margin:0;color:#647269;font-size:12px}.meta{display:flex;gap:12px;grid-column:1;color:#647269;font-size:11px}.meta b{color:#197847}.open{grid-column:2;grid-row:1/4;align-self:stretch;min-width:82px;border:1px solid #bfd1c4;border-radius:6px;color:#197847;background:#fff;font-size:11px;font-weight:800}.open:active{background:#eaf4ed}
    .detail{display:none;margin-top:18px}.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:18px;color:#fff;border-radius:12px;background:linear-gradient(135deg,#197847,#0f5f35)}.detail-head h2{margin:3px 0;font-size:clamp(26px,7vw,42px);line-height:.95}.detail-head p{margin:0;color:#d8efdf;font-size:12px}.close{min-height:38px;padding:0 11px;border:1px solid #ffffff60;border-radius:6px;color:#fff;background:#ffffff14;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{padding:12px;border:1px solid #d5e0d8;border-radius:8px;background:#fff}.stat span{display:block;color:#647269;font-size:10px;text-transform:uppercase}.stat b{display:block;margin-top:3px;color:#197847;font-size:18px}.panel{padding:15px}.panel h3{margin:0 0 10px;font-size:16px}.clubs{display:flex;flex-wrap:wrap;gap:6px}.club{padding:8px 10px;border:1px solid #d5e0d8;border-radius:6px;color:#17231d;background:#fff;font-size:11px}.empty{padding:25px;text-align:center;color:#647269}
    .footer-link{display:block;margin:28px auto 0;color:#197847;text-align:center;font-size:12px;text-decoration:none}.footer-link:hover{text-decoration:underline}
    @media(max-width:640px){.topbar{padding:11px 12px}.top-actions a{padding:0 9px;font-size:11px}.hero{align-items:start;flex-direction:column;padding:18px}.hero-count{text-align:left}.toolbar{display:block}.filters{margin-top:10px}.grid{grid-template-columns:1fr}.championship{padding:14px}.championship h3{font-size:18px}.open{min-width:76px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px 8px}.stat b{font-size:15px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark">🏆</div><div><strong>Arena BDA</strong><span>Portal de campeonatos</span></div></div><div class="top-actions"><a href="./arena-completo.html">Outras funções</a></div></header>
  <main>
    <section class="hero"><div><span class="eyebrow">Clã BDA</span><h1>Campeonatos</h1><p>Jogos, tabelas e clubes em um só lugar.</p></div><div class="hero-count"><b id="count">0</b><span>competições</span></div></section>
    <div class="toolbar"><h2>Temporadas</h2><div class="filters"><button class="filter active" data-filter="Todos">Todos</button><button class="filter" data-filter="Abertos">Abertos</button><button class="filter" data-filter="Finalizados">Finalizados</button></div></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <section class="detail" id="detail"></section>
    <a class="footer-link" href="./arena-completo.html">Abrir ferramentas completas da Arena BDA</a>
  </main>
  <script>
    (()=>{const seeds=[
      {id:'copa-grifo',name:'Copa Grifo BDA',edition:'8ª edição',format:'Mata-mata',status:'Finalizado',phase:'Campeão definido',maxTeams:19,badge:'🦅',participants:['Zombie FC BDA','JOGOBUGADO BDA','Inter Brasil BDA','Vasco da Gama BDA'],description:'Competição tradicional do Clã BDA.'},
      {id:'copa-francos',name:'Copa Francos',edition:'Próxima edição',format:'Mata-mata',status:'Planejado',phase:'Preparação',maxTeams:16,badge:'🕊️',participants:[],description:'Competição especial do Clã BDA.'},
      {id:'liga-a',name:'Liga A BDA',edition:'Temporada atual',format:'Pontos corridos',status:'Em andamento',phase:'Fase de classificação',maxTeams:12,badge:'🥇',participants:['Zombie FC BDA','JOGOBUGADO BDA','Inter Brasil BDA','Vasco da Gama BDA','São Paulo BDA','Mozamigos BDA'],description:'Primeira divisão do Clã BDA.'},
      {id:'liga-b',name:'Liga B BDA',edition:'Temporada atual',format:'Pontos corridos',status:'Inscrições abertas',phase:'Fase de classificação',maxTeams:12,badge:'🛡️',participants:[],description:'Divisão de acesso do Clã BDA.'}
    ];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let tournaments=(()=>{try{const v=JSON.parse(localStorage.getItem('bda-v3-tournaments'));return Array.isArray(v)&&v.length?v:seeds}catch{return seeds}})();['liga-a','liga-b'].forEach(id=>{if(!tournaments.some(t=>t.id===id)){const s=seeds.find(t=>t.id===id);if(s)tournaments.push(s)}});let filter='Todos';
    const grid=document.getElementById('grid'),detail=document.getElementById('detail'),count=document.getElementById('count');
    const visible=()=>filter==='Todos'?tournaments:filter==='Abertos'?tournaments.filter(t=>['Em andamento','Inscrições abertas','Planejado'].includes(t.status)):tournaments.filter(t=>t.status==='Finalizado');
    function render(){const list=visible();count.textContent=tournaments.length;grid.innerHTML=list.map(t=>{const n=Array.isArray(t.participants)?t.participants.length:0;return '<article class="card championship"><div><span class="eyebrow" style="color:#197847">'+esc(t.status)+'</span><h3>'+esc(t.badge||'🏆')+' '+esc(t.name)+'</h3></div><button class="open" data-open="'+esc(t.id)+'">Abrir</button><p>'+esc(t.description||'Competição do Clã BDA.')+'</p><div class="meta"><span><b>'+esc(t.format||'A definir')+'</b> formato</span><span><b>'+n+'/'+(Number(t.maxTeams)||'∞')+'</b> clubes</span></div></article>'}).join('')||'<div class="card empty">Nenhuma competição nesta categoria.</div>'}
    function open(id){const t=tournaments.find(x=>x.id===id);if(!t)return;const clubs=Array.isArray(t.participants)?t.participants:[];detail.innerHTML='<div class="detail-head"><div><span class="eyebrow">'+esc(t.status)+'</span><h2>'+esc(t.badge||'🏆')+' '+esc(t.name)+'</h2><p>'+esc(t.description||'Competição do Clã BDA.')+'</p></div><button class="close" data-close>Voltar</button></div><div class="stats"><div class="stat"><span>Formato</span><b>'+esc(t.format||'A definir')+'</b></div><div class="stat"><span>Fase</span><b>'+esc(t.phase||'Preparação')+'</b></div><div class="stat"><span>Clubes</span><b>'+clubs.length+'/'+(Number(t.maxTeams)||'∞')+'</b></div></div><div class="card panel"><h3>Clubes participantes</h3><div class="clubs">'+(clubs.length?clubs.map((c,i)=>'<span class="club">'+(i+1)+'. '+esc(c)+'</span>').join(''):'<span class="empty">Nenhum clube confirmado nesta edição.</span>')+'</div></div>';detail.classList.add('show');grid.style.display='none';document.querySelector('.toolbar').style.display='none';detail.scrollIntoView({block:'start',behavior:'auto'})}
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===f));render()}const o=e.target.closest('[data-open]');if(o)open(o.dataset.open);if(e.target.closest('[data-close]')){detail.classList.remove('show');grid.style.display='grid';document.querySelector('.toolbar').style.display='flex';window.scrollTo({top:0,behavior:'auto'})}});
    render();
  })();
  </script>
</body>
</html>
