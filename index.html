<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100c">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Arena BDA">
  <meta name="apple-mobile-web-app-title" content="Arena BDA">
  <meta name="description" content="Plataforma oficial para criação e acompanhamento dos campeonatos do Clã BDA.">
  <meta property="og:title" content="Arena BDA | Campeonatos do Clã">
  <meta property="og:description" content="Campeonatos, clubes, resultados, notícias e comunidade do Clã BDA.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//www.gstatic.com">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="shortcut icon" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="manifest" href="./site.webmanifest">
  <title>Arena BDA | Campeonatos do Clã</title>
  <style>
    :root{--bg:#07100c;--surface:#101d16;--text:#f4f7f2;--muted:#9fb0a5;--gold:#d8b248;--gold-soft:#f2d77d;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .stage{position:fixed;inset:0;background:var(--bg)}
    #arenaFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .22s ease}
    #arenaFrame.ready{opacity:1}
    .loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 20%,rgba(216,178,72,.15),transparent 30%),var(--bg);transition:opacity .2s ease,visibility .2s ease}
    .loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loader-card{width:min(360px,92vw);padding:26px 22px;border:1px solid rgba(216,178,72,.3);border-radius:24px;background:rgba(16,29,22,.9);box-shadow:0 20px 60px rgba(0,0,0,.38)}
    .griffin{width:76px;height:76px;margin:0 auto 14px;overflow:hidden;border:1px solid rgba(216,178,72,.46);border-radius:21px;background:#020503;box-shadow:0 8px 28px rgba(216,178,72,.24)}
    .griffin img{display:block;width:100%;height:100%;object-fit:cover}
    h1{margin:0 0 8px;font-size:22px;line-height:1.15}
    p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .spinner{width:34px;height:34px;margin:18px auto 0;border:3px solid rgba(242,215,125,.2);border-top-color:var(--gold-soft);border-radius:50%;animation:spin .8s linear infinite}
    .retry{display:none;width:100%;min-height:46px;margin-top:18px;border:0;border-radius:14px;color:#171107;background:linear-gradient(135deg,var(--gold-soft),var(--gold));font-weight:800;cursor:pointer}
    .retry.show{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#arenaFrame,.loading{transition:none}.spinner{animation-duration:1.6s}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="loading" id="loadingPanel" aria-live="polite">
      <div class="loader-card">
        <div class="griffin"><img src="./favicon.svg" alt="Escudo oficial Arena BDA" width="76" height="76" decoding="async" fetchpriority="high"></div>
        <h1 id="loadingTitle">Carregando a Arena BDA</h1>
        <p id="loadingMessage">Preparando campeonatos, clubes e resultados...</p>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <button class="retry" id="retryButton" type="button">Tentar novamente</button>
      </div>
    </section>
    <iframe id="arenaFrame" title="Arena BDA" src="about:blank" data-src="./preview-v2.html" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    (() => {
      'use strict';

      const frame = document.getElementById('arenaFrame');
      const panel = document.getElementById('loadingPanel');
      const title = document.getElementById('loadingTitle');
      const message = document.getElementById('loadingMessage');
      const spinner = document.getElementById('spinner');
      const retryButton = document.getElementById('retryButton');
      const frameSource = frame.dataset.src || './preview-v2.html';

      const firebaseScripts = [
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'
      ];

      const coreScripts = [
        './arena-dom-events.js?v=20260801-1',
        './arena-media-performance.js?v=20260803-1',
        './team-badges.js',
        './bda-logo.js',
        './arena-bda.js?v=20260801-2',
        './cores-automaticas-campeonatos.js?v=20260802-2',
        './home-campeonato-atual-v2.js?v=20260801-2',
        './arena-lazy-features.js?v=20260803-4',
        './navegacao-arena-v2.js?v=20260802-3',
        './arena-design-system.js?v=20260803-1'
      ];

      const cloudScripts = [
        './firebase-auth.js?v=20260801-3',
        './notificacoes-bda.js?v=20260801-2',
        './firestore-sync.js?v=20260801-5',
        './cloud-recovery.js?v=20260801-4',
        './admin-panel.js?v=20260801-4',
        './arena-auth-consumers.js?v=20260726-1',
        './site-health.js?v=20260801-4'
      ];

      let loadingTimeoutId = 0;
      let loadGeneration = 0;
      let expectedToken = '';

      function setLoadingState() {
        panel.classList.remove('hidden');
        frame.classList.remove('ready');
        retryButton.classList.remove('show');
        spinner.hidden = false;
        title.textContent = 'Carregando a Arena BDA';
        message.textContent = 'Preparando campeonatos, clubes e resultados...';
        clearTimeout(loadingTimeoutId);
        loadingTimeoutId = window.setTimeout(() => {
          title.textContent = 'A Arena está demorando para abrir';
          message.textContent = 'A conexão pode estar instável. Você pode tentar novamente sem fechar a página.';
          spinner.hidden = true;
          retryButton.classList.add('show');
        }, 12000);
      }

      function showLoadError(detail = 'Verifique sua conexão e tente novamente.') {
        clearTimeout(loadingTimeoutId);
        panel.classList.remove('hidden');
        frame.classList.remove('ready');
        title.textContent = 'Não foi possível abrir a Arena';
        message.textContent = detail;
        spinner.hidden = true;
        retryButton.classList.add('show');
      }

      function queueScript(doc, src, timeoutMs = 15000, priority = 'auto') {
        return new Promise((resolve, reject) => {
          const absoluteSrc = new URL(src, doc.baseURI).href;
          const existing = Array.from(doc.scripts).find(script => script.dataset.arenaSrc === absoluteSrc);
          if (existing) {
            if (existing.dataset.arenaLoaded === 'true') {
              resolve({ src, reused: true });
              return;
            }

            const timeoutId = window.setTimeout(
              () => reject(new Error(`Tempo esgotado ao aguardar ${src}`)),
              timeoutMs
            );
            existing.addEventListener('load', () => {
              clearTimeout(timeoutId);
              resolve({ src, reused: true });
            }, { once: true });
            existing.addEventListener('error', () => {
              clearTimeout(timeoutId);
              reject(new Error(`Falha ao carregar ${src}`));
            }, { once: true });
            return;
          }

          const script = doc.createElement('script');
          let settled = false;
          const timeoutId = window.setTimeout(() => finish(new Error(`Tempo esgotado ao carregar ${src}`)), timeoutMs);

          function finish(error = null) {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            script.removeEventListener('load', onLoad);
            script.removeEventListener('error', onError);
            if (error) {
              script.remove();
              reject(error);
            } else {
              script.dataset.arenaLoaded = 'true';
              resolve({ src, reused: false });
            }
          }

          function onLoad() { finish(); }
          function onError() { finish(new Error(`Falha ao carregar ${src}`)); }

          script.src = absoluteSrc;
          script.async = false;
          script.fetchPriority = priority;
          script.dataset.arenaSrc = absoluteSrc;
          script.addEventListener('load', onLoad, { once: true });
          script.addEventListener('error', onError, { once: true });
          (doc.body || doc.head || doc.documentElement).appendChild(script);
        });
      }

      async function loadOrderedBatch(doc, scripts, failures, timeoutMs) {
        const requests = scripts.map((src, index) =>
          queueScript(doc, src, timeoutMs + (index * 250), index < 6 ? 'high' : 'auto').catch(error => {
            failures.push({ src, error });
            console.error(`[Arena BDA] Falha no módulo ${src}`, error);
          })
        );
        await Promise.all(requests);
      }

      async function enhanceArena(generation) {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc || generation !== loadGeneration) return;
        const startedAt = window.performance.now();

        doc.documentElement.dataset.theme = 'dark';
        doc.documentElement.style.colorScheme = 'dark';
        try { win.localStorage.removeItem('arena-bda-theme'); } catch {}

        const coreFailures = [];
        const cloudFailures = [];
        let cloudPromise = null;
        let cloudReady = false;

        const ensureCloud = reason => {
          if (cloudPromise) return cloudPromise;
          cloudPromise = (async () => {
            doc.documentElement.dataset.arenaCloud = 'loading';
            await loadOrderedBatch(doc, firebaseScripts, cloudFailures, 12000);
            if (generation !== loadGeneration) return;
            await loadOrderedBatch(doc, cloudScripts, cloudFailures, 15000);
            if (generation !== loadGeneration) return;
            cloudReady = true;
            doc.documentElement.dataset.arenaCloud = cloudFailures.length ? 'partial' : 'ready';
            win.dispatchEvent(new win.CustomEvent('arena:cloud-ready', {
              detail: { reason, failures: cloudFailures.map(item => item.src) }
            }));
          })();
          return cloudPromise;
        };

        doc.addEventListener('click', event => {
          const adminButton = event.target instanceof win.Element && event.target.closest('#adminBtn');
          if (!adminButton || cloudReady) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          adminButton.setAttribute('aria-busy', 'true');
          adminButton.textContent = 'CARREGANDO...';
          ensureCloud('admin').then(() => doc.getElementById('adminBtn')?.click()).catch(error => {
            console.error('[Arena BDA] Falha ao preparar login', error);
          });
        }, true);

        await loadOrderedBatch(doc, coreScripts, coreFailures, 15000);

        if (generation !== loadGeneration) return;

        doc.documentElement.dataset.arenaEnhanced = coreFailures.length ? 'partial' : 'true';
        doc.documentElement.dataset.arenaLoadMs = String(Math.round(window.performance.now() - startedAt));
        win.dispatchEvent(new win.CustomEvent('arena:enhanced', {
          detail: {
            failures: coreFailures.map(item => item.src),
            loadMs: Number(doc.documentElement.dataset.arenaLoadMs)
          }
        }));
        if (coreFailures.length && typeof win.toast === 'function') {
          win.toast('A Arena abriu, mas alguns recursos não carregaram');
        }

        const startCloudWhenIdle = () => ensureCloud('idle').catch(error => {
          console.error('[Arena BDA] Recursos online não carregaram', error);
        });
        if ('requestIdleCallback' in win) win.requestIdleCallback(startCloudWhenIdle, { timeout: 3500 });
        else win.setTimeout(startCloudWhenIdle, 2500);
      }

      function validArenaDocument() {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          if (!win || !doc || win.location.href === 'about:blank') return false;
          const token = new URL(win.location.href).searchParams.get('arenaLoad');
          return token === expectedToken && Boolean(doc.querySelector('.app-shell'));
        } catch (error) {
          console.error('[Arena BDA] Não foi possível validar o conteúdo carregado', error);
          return false;
        }
      }

      function startLoad() {
        loadGeneration += 1;
        expectedToken = `${Date.now()}-${loadGeneration}`;
        setLoadingState();
        const url = new URL(frameSource, window.location.href);
        url.searchParams.set('arenaLoad', expectedToken);
        frame.src = url.href;
      }

      frame.addEventListener('load', () => {
        if (!validArenaDocument()) {
          let isBlank = false;
          try { isBlank = frame.contentWindow?.location?.href === 'about:blank'; } catch {}
          if (!isBlank) showLoadError('A página principal não respondeu corretamente. Tente carregar outra vez.');
          return;
        }

        const generation = loadGeneration;
        clearTimeout(loadingTimeoutId);
        frame.classList.add('ready');
        panel.classList.add('hidden');
        enhanceArena(generation);
      });

      frame.addEventListener('error', () => {
        showLoadError();
      });

      retryButton.addEventListener('click', startLoad);
      startLoad();
    })();
  </script>
</body>
</html>
