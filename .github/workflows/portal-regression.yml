name: Portal regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: bash scripts/check-site.sh
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Test isolated Firestore rules
        run: npm run test:rules
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firestore-emulator-logs
          path: '*-debug.log'
          retention-days: 7
  dependency-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Record development tooling advisories
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
