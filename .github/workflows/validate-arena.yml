name: Validate Arena BDA

on:
  push:
    branches:
      - agent/otimizar-arena-bda
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.html"
      - "**/*.css"
      - "**/*.json"
      - "**/*.webmanifest"
      - "**/*.rules"
      - ".github/workflows/validate-arena.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            arena-bootstrap.js
            media-storage.js
            arena-bda-v4.js
            firestore-sync-v4.js
            arena-lazy-features-v2.js
            arena-router.js
            central-inscricoes-v2.js
            arena-security.js
            arena-observability.js
            sw.js
          )
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest JSON
        run: python -m json.tool site.webmanifest > /dev/null

      - name: Parse HTML
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class StrictEnoughParser(HTMLParser):
              pass

          content = Path("index.html").read_text(encoding="utf-8")
          parser = StrictEnoughParser()
          parser.feed(content)
          parser.close()
          required = [
              'id="adminBtn"',
              'id="adminModal"',
              'id="teamForm"',
              'id="championForm"',
              'id="chatForm"',
              'src="./arena-bootstrap.js',
          ]
          missing = [item for item in required if item not in content]
          if missing:
              raise SystemExit(f"Missing required Arena elements: {missing}")

      - name: Guard against blocking reloads
        shell: bash
        run: |
          set -euo pipefail
          if grep -n "location.reload" firestore-sync-v4.js central-inscricoes-v2.js; then
            echo "Blocking reload found in data synchronization files"
            exit 1
          fi

      - name: Verify progressive entrypoint
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "fetch('./preview-v2.html'" index.html
          ! grep -n "document.write" index.html
          grep -n "arena-bootstrap.js" index.html
