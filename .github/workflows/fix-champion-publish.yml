name: Apply champion publish fix

on:
  push:
    branches: [agent/fix-champion-publish]
    paths:
      - '.github/workflows/fix-champion-publish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch champions bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('arena-lazy-features.js')
          s = p.read_text()
          old = "'./ranking-campeoes.js?v=20260815-1'"
          new = "'./ranking-campeoes.js?v=20260815-1',\n      './arena-champion-publish.js?v=20260913-1'"
          if "./arena-champion-publish.js?v=20260913-1" not in s:
              if old not in s:
                  raise SystemExit('champions bundle anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          else:
              print('already patched')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arena-lazy-features.js
          git commit -m 'feat: publish champions to site' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-champion-publish.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push
